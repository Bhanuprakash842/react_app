name: React App - Terraform + Docker + Azure CD

on:
  push:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: reactapp-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1: CI - TEST AND BUILD REACT APP
  # Runs on dev and main
  # ==========================================

  ci:
    name: CI - Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build React Application
        run: npm run build


  # ==========================================
  # JOB 2: TERRAFORM - AZURE INFRASTRUCTURE
  # Runs only on main
  # ==========================================

  provision:
    name: Terraform - Azure Infrastructure
    runs-on: ubuntu-latest
    needs: ci

    if: github.ref == 'refs/heads/main'

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_admin_source_cidr: ${{ vars.AZURE_ADMIN_SOURCE_CIDR }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_LOCATION: ${{ vars.TFSTATE_LOCATION }}
      TFSTATE_ALLOW_EMPTY: ${{ vars.TFSTATE_ALLOW_EMPTY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Verify and Prepare Terraform Backend
        shell: bash
        run: |
          set -euo pipefail

          echo "========== TERRAFORM BACKEND CHECK =========="

          # Validate required configuration
          for variable in \
            TFSTATE_RESOURCE_GROUP \
            TFSTATE_STORAGE_ACCOUNT \
            TFSTATE_CONTAINER \
            TFSTATE_LOCATION; do

            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is missing"
              exit 1
            fi
          done

          # Azure Storage Account naming validation
          if [[ ! "$TFSTATE_STORAGE_ACCOUNT" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "::error::Invalid Azure Storage Account name"
            exit 1
          fi

          echo "Resource Group: $TFSTATE_RESOURCE_GROUP"
          echo "Storage Account: $TFSTATE_STORAGE_ACCOUNT"
          echo "Container: $TFSTATE_CONTAINER"

          # STEP 1: Check Resource Group
          echo "========== CHECKING RESOURCE GROUP =========="

          if ! az group show \
            --name "$TFSTATE_RESOURCE_GROUP" \
            --output none 2>/dev/null; then

            echo "Resource Group missing. Creating..."

            az group create \
              --name "$TFSTATE_RESOURCE_GROUP" \
              --location "$TFSTATE_LOCATION" \
              --output none
          else
            echo "Resource Group already exists."
          fi

          STATE_RG_ID=$(az group show \
            --name "$TFSTATE_RESOURCE_GROUP" \
            --query id \
            --output tsv)

          # STEP 2: Check Storage Account
          echo "========== CHECKING STORAGE ACCOUNT =========="

          if ! az storage account show \
            --resource-group "$TFSTATE_RESOURCE_GROUP" \
            --name "$TFSTATE_STORAGE_ACCOUNT" \
            --output none 2>/dev/null; then

            echo "Storage Account missing. Creating..."

            az storage account create \
              --name "$TFSTATE_STORAGE_ACCOUNT" \
              --resource-group "$TFSTATE_RESOURCE_GROUP" \
              --location "$TFSTATE_LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --https-only true \
              --allow-blob-public-access false \
              --allow-shared-key-access false \
              --output none

            echo "Storage Account created."
          else
            echo "Storage Account already exists."
          fi

          # STEP 3: Enable Terraform state protection
          echo "========== CONFIGURING STATE PROTECTION =========="

          az storage account blob-service-properties update \
            --resource-group "$TFSTATE_RESOURCE_GROUP" \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --enable-versioning true \
            --enable-delete-retention true \
            --delete-retention-days 14 \
            --enable-container-delete-retention true \
            --container-delete-retention-days 14 \
            --output none

          echo "Blob versioning and soft delete configured."

          # STEP 4: Create/check Blob Container
          echo "========== CHECKING BLOB CONTAINER =========="

          CONTAINER_READY=false

          for attempt in $(seq 1 12); do

            if az storage container create \
              --name "$TFSTATE_CONTAINER" \
              --account-name "$TFSTATE_STORAGE_ACCOUNT" \
              --auth-mode login \
              --public-access off \
              --only-show-errors \
              --output none; then

              CONTAINER_READY=true
              echo "Blob Container is ready."
              break
            fi

            echo "Container creation/access attempt $attempt failed."
            echo "Waiting for Azure RBAC propagation..."
            sleep 10
          done

          if [ "$CONTAINER_READY" != "true" ]; then
            echo "::error::Unable to access the state container."
            echo "Check Storage Blob Data Contributor RBAC."
            exit 1
          fi

          # STEP 5: Protect existing Terraform state
          echo "========== CHECKING TERRAFORM STATE =========="

          STATE_EXISTS=$(az storage blob exists \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --container-name "$TFSTATE_CONTAINER" \
            --name "reactapp-prod.tfstate" \
            --auth-mode login \
            --query exists \
            --output tsv)

          if [ "$STATE_EXISTS" != "true" ]; then

            if [ "${TFSTATE_ALLOW_EMPTY:-false}" != "true" ]; then
              echo "::error::Terraform state file is missing!"
              echo "Refusing to continue with an empty state backend."
              echo "Restore your previous state or verify initial setup."
              exit 1
            fi

            echo "::warning::Empty backend explicitly allowed for initial setup."
          else
            echo "Existing Terraform state file found."
          fi

          echo "========== BACKEND PREFLIGHT COMPLETED =========="

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -input=false \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=reactapp-prod.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # Generate and display the infrastructure plan
      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -out=tfplan
          terraform show -no-color tfplan

      # Prevent accidental VM/resource deletion or replacement
      - name: Terraform Destructive Change Check
        working-directory: terraform
        run: |
          if terraform show -json tfplan | jq -e \
            '[.resource_changes[]?.change.actions[]?] | any(. == "delete")' \
            > /dev/null; then
            echo "::error::Terraform plan contains a deletion or replacement."
            echo "Review the plan before allowing this deployment."
            exit 1
          fi

          echo "Safety check passed. No resource deletion or replacement detected."

      # Apply the reviewed plan
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      # Display all resources tracked by Terraform
      - name: Show Terraform Infrastructure State
        working-directory: terraform
        run: |
          echo "========== TERRAFORM RESOURCE LIST =========="
          terraform state list

          echo "========== AZURE VM RESOURCE DETAILS =========="
          terraform state show azurerm_linux_virtual_machine.vm

          echo "========== TERRAFORM PLAN SUMMARY =========="
          terraform show -no-color tfplan | tail -n 15

      # Display actual Azure VM information
      - name: Show Azure VM Details
        run: |
          echo "========== AZURE VM DETAILS =========="

          az vm show \
            --resource-group reactapp-infra-rg \
            --name reactapp-vm \
            --show-details \
            --query "{VMName:name, Location:location, PublicIP:publicIps, PowerState:powerState}" \
            --output table


  # ==========================================
  # JOB 3: DOCKER - BUILD AND PUSH IMAGE
  # Runs on dev and main
  # ==========================================

  docker:
    name: Docker - Build and Push
    runs-on: ubuntu-latest
    needs: ci

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Docker Image Tags
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            TAG="dev-${GITHUB_SHA::7}"
            LATEST_TAG="dev-latest"
          else
            TAG="main-${GITHUB_SHA::7}"
            LATEST_TAG="latest"
          fi

          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/reactapp:${TAG}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          echo "========== DOCKER IMAGE DETAILS =========="
          echo "Image: $IMAGE"
          echo "Latest tag: $LATEST_TAG"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/reactapp:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/reactapp:${{ steps.meta.outputs.latest_tag }}


  # ==========================================
  # JOB 4: DEPLOY TO AZURE LINUX VM
  # Runs only on main
  # ==========================================

  deploy:
    name: Deploy - Azure Linux VM
    runs-on: ubuntu-latest

    needs:
      - provision
      - docker

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy using Azure VM Run Command - no SSH private key needed
      - name: Deploy Docker Container
        env:
          IMAGE: ${{secrets.DOCKERHUB_USERNAME}}/reactapp:latest
        run: |
          echo "========== DEPLOYMENT STARTED =========="
          echo "Docker Image: $IMAGE"

          az vm run-command invoke \
            --resource-group reactapp-infra-rg \
            --name reactapp-vm \
            --command-id RunShellScript \
            --scripts "
              set -e

              echo 'Waiting for cloud-init...'
              cloud-init status --wait || true

              echo 'Starting Docker...'
              sudo systemctl enable --now docker

              if ! command -v curl >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y curl
              fi

              echo 'Pulling Docker image...'
              sudo docker pull '$IMAGE'

              echo 'Removing previous container...'
              sudo docker rm -f reactapp-prod || true

              echo 'Starting new container...'
              sudo docker run -d \
                --name reactapp-prod \
                --restart unless-stopped \
                -p 80:80 \
                '$IMAGE'

              echo 'Checking application health...'

              for attempt in {1..12}; do
                if curl -fsS http://localhost/ >/dev/null; then
                  echo 'Application is responding successfully!'
                  exit 0
                fi

                echo 'Waiting for application...'
                sleep 5
              done

              echo 'Application health check failed!'
              sudo docker logs --tail 50 reactapp-prod
              exit 1
            "

      # Show final application URL
      - name: Show Deployment Details
        run: |
          PUBLIC_IP=$(az vm show \
            --resource-group reactapp-infra-rg \
            --name reactapp-vm \
            --show-details \
            --query publicIps \
            --output tsv)

          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "VM: reactapp-vm"
          echo "Application URL: http://$PUBLIC_IP"
          echo "======================================"
