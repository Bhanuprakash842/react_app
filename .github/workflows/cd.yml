name: CD — Build, Push & Deploy

on:
  push:
    branches:
      - dev    # triggers build + push to Docker Hub only
      - main   # triggers build + push + deploy to Azure VM

jobs:
  # -----------------------------------------------
  # JOB 1: Run tests (same for both branches)
  # -----------------------------------------------
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --ci
        env:
          CI: true

  # -----------------------------------------------
  # JOB 2: Build & push Docker image
  # -----------------------------------------------
  build-and-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/reactapp
          tags: |
            type=raw,value=dev-latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=dev-,format=short,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

 
  # -----------------------------------------------
  # JOB 3: Deploy to Azure VM — MAIN BRANCH ONLY
  # -----------------------------------------------
  deploy:
    name: 🚀 Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      # 1. Extract the production image tag
      - name: Extract deployment image tag
        id: deploy-meta
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 2. SSH into Azure VM and deploy
      - name: SSH into Azure VM and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}

          script: |
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/reactapp"
            TAG="${{ steps.deploy-meta.outputs.tag }}"

            echo "Deploying image: $IMAGE:$TAG"

            docker pull "$IMAGE:$TAG"

            docker stop reactapp-prod 
            docker rm reactapp-prod 

            docker run -d \
              --name reactapp-prod \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE:$TAG"

            echo "Production deployment complete!"
